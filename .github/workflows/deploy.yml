name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master # Deploy when pushing to master
  workflow_dispatch: # Allow manual triggers

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_ATELIER_PACKAGE_ID: ${{ secrets.VITE_ATELIER_PACKAGE_ID || vars.VITE_ATELIER_PACKAGE_ID || '0xb1b63cf15e0fe6c5fde1e9f6a39d33ec9e5261005a745520cf1b0429cef0f738' }}
          # Add other env variables here. 
          # If there is a secret salt, add:
          # VITE_HASH_SALT: ${{ secrets.VITE_HASH_SALT }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
